components:
  schemas:
    Address:
      type: object
      properties:
        address:
          type: string
          x-source:
            kind: attribute
            name: Address
            member: address
      required:
        - address
      x-source:
        kind: class
        name: Address
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - message
      description: Standard error payload.
      x-source:
        kind: class
        name: ApiError
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
      x-source:
        kind: enum
        name: Gender
    Person:
      type: object
      properties:
        address:
          type: array
          items:
            $ref: "#/components/schemas/Address"
          minItems: 1
          x-source:
            kind: relation
            name: Person
            member: address
        age:
          type: integer
          format: int32
          x-source:
            kind: attribute
            name: Person
            member: age
        name:
          type: string
          x-source:
            kind: attribute
            name: Person
            member: name
      required:
        - address
        - name
      x-source:
        kind: class
        name: Person
      x-methods:
        - name: greet
          access: public
          returnType: void
    Speakable:
      type: object
      x-source:
        kind: class
        name: Speakable
      x-methods:
        - name: speak
          access: public
          returnType: void
    Student:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          properties:
            module:
              type: string
              x-source:
                kind: attribute
                name: Student
                member: module
          required:
            - module
          x-source:
            kind: class
            name: Student
