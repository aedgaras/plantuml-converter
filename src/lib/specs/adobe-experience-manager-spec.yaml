openapi: 3.0.0
info:
  title: Adobe Experience Manager (AEM) API
  description: Trimmed subset of the AEM administrative API optimized for diagram generation.
  version: 3.7.1-pre.0
  contact:
    name: Shine Solutions
    url: http://shinesolutions.com
    email: opensource@shinesolutions.com
servers:
  - url: /
  - url: http://adobe.local
security:
  - aemAuth: []
paths:
  /crx/packmgr/installstatus.jsp:
    get:
      summary: Retrieve the CRX Package Manager install status.
      operationId: getInstallStatus
      tags:
        - crx
      responses:
        "200":
          description: Install status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallStatus"
        default:
          description: Unexpected error payload.
          content:
            application/json:
              schema:
                type: string
  /libs/granite/security/truststore.json:
    get:
      summary: Retrieve the global truststore metadata.
      operationId: getTruststoreInfo
      tags:
        - security
      responses:
        "200":
          description: Truststore metadata snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TruststoreInfo"
        default:
          description: Unexpected error payload.
          content:
            application/json:
              schema:
                type: string
  /system/console/bundles/{name}.json:
    parameters:
      - name: name
        in: path
        required: true
        description: Symbolic name of the bundle to inspect.
        schema:
          type: string
    get:
      summary: Retrieve information about a single OSGi bundle.
      operationId: getBundleInfo
      tags:
        - console
      responses:
        "200":
          description: Bundle metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleInfo"
        default:
          description: Unexpected error payload.
          content:
            application/json:
              schema:
                type: string
  /system/console/configMgr/com.adobe.granite.auth.saml.SamlAuthenticationHandler:
    get:
      summary: Retrieve the configured SAML authentication handler settings.
      operationId: getSamlConfiguration
      tags:
        - console
      responses:
        "200":
          description: Current SAML configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlConfigurationInfo"
        default:
          description: Unexpected error payload.
          content:
            application/json:
              schema:
                type: string
    post:
      summary: Update the SAML authentication handler settings.
      operationId: postSamlConfiguration
      tags:
        - console
      requestBody:
        $ref: "#/components/requestBodies/SamlConfigurationSettingsBody"
      responses:
        "200":
          description: Updated configuration snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlConfigurationInfo"
        default:
          description: Validation error payload.
          content:
            application/json:
              schema:
                type: string
  /authorizables/{authorizableId}/keystore:
    parameters:
      - name: authorizableId
        in: path
        required: true
        description: Identifier of the user or group whose keystore is managed.
        schema:
          type: string
    get:
      summary: Retrieve metadata for a specific authorizable keystore.
      operationId: getAuthorizableKeystore
      tags:
        - security
      responses:
        "200":
          description: Authorizable keystore metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeystoreInfo"
        default:
          description: Unexpected error payload.
          content:
            application/json:
              schema:
                type: string
    post:
      summary: Upload or replace the keystore for a specific authorizable.
      operationId: postAuthorizableKeystore
      tags:
        - security
      requestBody:
        $ref: "#/components/requestBodies/KeystoreUpload"
      responses:
        "200":
          description: Updated keystore metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeystoreInfo"
        default:
          description: Validation error payload.
          content:
            application/json:
              schema:
                type: string
  /authorizables/{authorizableId}/keystore/file:
    parameters:
      - name: authorizableId
        in: path
        required: true
        description: Identifier of the user or group whose keystore binary is requested.
        schema:
          type: string
    get:
      summary: Download the keystore package for the authorizable.
      operationId: getAuthorizableKeystoreFile
      tags:
        - security
      responses:
        "200":
          description: Binary PKCS#12 keystore.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Unexpected error payload.
          content:
            application/json:
              schema:
                type: string
components:
  requestBodies:
    SamlConfigurationSettingsBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SamlConfigurationSettings"
    KeystoreUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - keyStore
            properties:
              keyStore:
                type: string
                format: binary
                description: PKCS#12 keystore archive.
              certChain:
                type: string
                format: binary
                description: Certificate chain accompanying the keystore.
              privateKey:
                type: string
                format: binary
                description: Optional private key material.
              currentPassword:
                type: string
              newPassword:
                type: string
              confirmPassword:
                type: string
  schemas:
    InstallStatus:
      type: object
      properties:
        status:
          type: object
          properties:
            finished:
              type: boolean
            itemCount:
              type: integer
        details:
          type: array
          items:
            type: string
    TruststoreInfo:
      type: object
      properties:
        exists:
          type: boolean
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/TruststoreItems"
    TruststoreItems:
      type: object
      properties:
        alias:
          type: string
        entryType:
          type: string
        issuer:
          type: string
        subject:
          type: string
        notBefore:
          type: string
          description: Start date of the certificate validity period.
        notAfter:
          type: string
          description: End date of the certificate validity period.
        serialNumber:
          type: integer
    BundleInfo:
      type: object
      properties:
        status:
          type: string
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/BundleData"
    BundleData:
      type: object
      properties:
        id:
          type: integer
        symbolicName:
          type: string
        version:
          type: string
        category:
          type: string
        state:
          type: string
        stateRaw:
          type: integer
        fragment:
          type: boolean
        props:
          type: array
          items:
            $ref: "#/components/schemas/BundleDataProp"
    BundleDataProp:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    KeystoreInfo:
      type: object
      properties:
        exists:
          type: boolean
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/KeystoreItems"
    KeystoreItems:
      type: object
      properties:
        alias:
          type: string
        entryType:
          type: string
        algorithm:
          type: string
        format:
          type: string
        chain:
          type: array
          items:
            $ref: "#/components/schemas/KeystoreChainItems"
    KeystoreChainItems:
      type: object
      properties:
        issuer:
          type: string
        subject:
          type: string
        notBefore:
          type: string
        notAfter:
          type: string
        serialNumber:
          type: integer
    SamlConfigurationInfo:
      type: object
      properties:
        pid:
          type: string
        title:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        properties:
          $ref: "#/components/schemas/SamlConfigurationProperties"
    SamlConfigurationProperties:
      type: object
      properties:
        serviceProviderEntityId:
          type: string
        idpUrl:
          type: string
        assertionConsumerServiceURL:
          type: string
        defaultRedirectUrl:
          type: string
        defaultGroups:
          type: array
          items:
            type: string
        synchronizeAttributes:
          type: array
          items:
            type: string
        userIDAttribute:
          type: string
        userIntermediatePath:
          type: string
        addGroupMemberships:
          type: boolean
        createUser:
          type: boolean
        useEncryption:
          type: boolean
        handleLogout:
          type: boolean
        logoutUrl:
          type: string
        nameIdFormat:
          type: string
        digestMethod:
          type: string
        signatureMethod:
          type: string
        spPrivateKeyAlias:
          type: string
        clockTolerance:
          type: integer
    SamlConfigurationSettings:
      type: object
      required:
        - serviceProviderEntityId
        - idpUrl
      properties:
        serviceProviderEntityId:
          type: string
        idpUrl:
          type: string
        assertionConsumerServiceURL:
          type: string
        defaultRedirectUrl:
          type: string
        defaultGroups:
          type: array
          items:
            type: string
        synchronizeAttributes:
          type: array
          items:
            type: string
        userIDAttribute:
          type: string
        userIntermediatePath:
          type: string
        addGroupMemberships:
          type: boolean
        createUser:
          type: boolean
        useEncryption:
          type: boolean
        handleLogout:
          type: boolean
        logoutUrl:
          type: string
        nameIdFormat:
          type: string
        digestMethod:
          type: string
        signatureMethod:
          type: string
        spPrivateKeyAlias:
          type: string
        clockTolerance:
          type: integer
  securitySchemes:
    aemAuth:
      type: http
      scheme: basic
